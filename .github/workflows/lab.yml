name: Teaching pack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python examples/mpw-handoff-lab/verify.py
      - run: pip install -r examples/mpw-handoff-lab/requirements.txt
      - run: python examples/mpw-handoff-lab/inspect.py
